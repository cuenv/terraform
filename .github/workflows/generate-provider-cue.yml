name: Generate Terraform provider CUE definitions

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-terraform-provider-cue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      has_updates: ${{ steps.plan.outputs.has_updates }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore generated provider output cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .provider-release-state.json
            generated/
            schema-snapshots/
          key: terraform-cue-provider-cache-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            terraform-cue-provider-cache-v2-

      - name: Initialize generated-release cursor
        run: |
          if [ ! -f .provider-release-state.json ]; then
            printf '{"completed": {}}\n' > .provider-release-state.json
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - name: Build generator
        run: cargo build --locked --release

      - name: Read Terraform CLI version
        id: terraform-version
        run: echo "version=$(target/release/terraform-cue terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Check for new provider releases
        id: plan
        shell: bash
        run: |
          set -o pipefail
          target/release/terraform-cue update \
            --state-file .provider-release-state.json \
            --dry-run | tee "$RUNNER_TEMP/provider-update-plan.txt"
          if grep -Eq '^would generate [1-9][0-9]* provider release' "$RUNNER_TEMP/provider-update-plan.txt"; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: hashicorp/setup-terraform@v4
        if: steps.plan.outputs.has_updates == 'true'
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Generate new provider definitions
        id: generate
        if: steps.plan.outputs.has_updates == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          target/release/terraform-cue update \
            --state-file .provider-release-state.json \
            2>&1 | tee "$RUNNER_TEMP/provider-generation.log"

      - name: Package generated files and release cursor
        if: steps.plan.outputs.has_updates == 'true'
        run: |
          mkdir -p generated schema-snapshots
          tar -czf "$RUNNER_TEMP/provider-cue-output.tar.gz" generated schema-snapshots
          cp .provider-release-state.json "$RUNNER_TEMP/provider-release-state.json"

      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.has_updates == 'true'
        with:
          name: provider-cue-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/provider-cue-output.tar.gz
            ${{ runner.temp }}/provider-release-state.json
            ${{ runner.temp }}/provider-generation.log
          retention-days: 90
          if-no-files-found: error

      - name: Cache generated provider outputs
        if: steps.plan.outputs.has_updates == 'true' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@v4
        with:
          path: |
            .provider-release-state.json
            generated/
            schema-snapshots/
          key: terraform-cue-provider-cache-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fail if one or more providers could not be generated
        if: steps.generate.outcome == 'failure'
        run: exit 1
